<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopCore Storefront</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f4f5f7; color: #1f2937; }
    header {
      background: #111827; color: #fff; padding: 16px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .container { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    button {
      background: #2563eb; color: #fff; border: none; padding: 10px 16px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #1f2937; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff; border-radius: 10px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .badge { font-size: 12px; color: #4b5563; background: #e5e7eb; padding: 3px 8px; border-radius: 999px; display: inline-block; }
    .price { font-size: 18px; font-weight: bold; margin: 10px 0 4px; color: #111827; }
    .stock { font-size: 13px; color: #059669; margin-bottom: 12px; }
    .out { color: #dc2626; }
    .log {
      margin-top: 24px; background: #111827; color: #e5e7eb;
      padding: 14px; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h2>ShopCore Storefront</h2>
    <span id="cartInfo">Orders Placed: 0</span>
  </header>

  <div class="container">
    <div class="toolbar">
      <button onclick="renderProducts()">View Products</button>
      <button class="secondary" onclick="addSampleProduct()">+ Add Sample Product</button>
    </div>

    <div id="productGrid" class="grid"></div>

    <div class="log" id="activityLog">Ready. Click "Buy Now" on a product to test stock deduction.</div>
  </div>

  <script>
    let products = [
      { id: 10, name: "Minimalist Analog Watch", category: "Accessories", price: 1599.00, stock: 12 },
      { id: 1, name: "Daily Running Shoes", category: "Footwear", price: 1899.00, stock: 15 },
      { id: 2, name: "Smart Casual Slip-On", category: "Footwear", price: 1499.00, stock: 18 },
      { id: 3, name: "Commuter Backpack", category: "Bags", price: 1299.00, stock: 20 }
    ];
    let orderCount = 0;

    function logMsg(text) {
      document.getElementById("activityLog").textContent = text;
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";
      products.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <span class="badge">${p.category}</span>
            <h3>#${p.id} ${p.name}</h3>
            <div class="price">Rs. ${p.price.toFixed(2)}</div>
            <div class="stock ${p.stock === 0 ? "out" : ""}">
              ${p.stock > 0 ? "Stock: " + p.stock : "Out of Stock"}
            </div>
          </div>
          <button ${p.stock === 0 ? "disabled" : ""} onclick="placeOrder(${p.id})">
            ${p.stock === 0 ? "Blocked (No Stock)" : "Place Order"}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function placeOrder(id) {
      const item = products.find((p) => p.id === id);
      if (!item || item.stock <= 0) {
        logMsg("Order blocked: insufficient stock.");
        return;
      }
      item.stock -= 1;
      orderCount += 1;
      document.getElementById("cartInfo").textContent = "Orders Placed: " + orderCount;
      logMsg(`Order confirmed for "${item.name}". Remaining stock: ${item.stock}`);
      renderProducts();
    }

    function addSampleProduct() {
      const nextId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
      products.push({
        id: nextId,
        name: "Roadster Trail Cap",
        category: "Accessories",
        price: 499.00,
        stock: 8
      });
      logMsg(`Added product #${nextId} (Roadster Trail Cap).`);
      renderProducts();
    }

    renderProducts();
  </script>
</body>
</html>
